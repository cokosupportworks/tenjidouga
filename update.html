<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" sizes="16x16 32x32 48x48" href="./favicon.ico">
<title>展示動画プレイヤーの更新</title>
<style>
  :root { color-scheme: dark; font: 100% system-ui, sans-serif; background: #101114; color: #f5f6f8 }
  main { max-width: 34rem; margin: 8vh auto; padding: 0 1.25rem }
  h1 { font-size: 1.4rem }
  p { line-height: 1.5 }
  button, a { display: inline-block; border-radius: .5rem; padding: .65rem 1rem; font: inherit }
  button { border: 0; background: #c7f5e2; color: #101114; cursor: pointer }
  button:disabled { opacity: .65; cursor: default }
  a { color: #c7f5e2 }
</style>
<script src="./update.js" defer></script>
</head>
<body>
<main>
  <h1>展示動画プレイヤーの更新</h1>
  <p>上映を終えてから更新してください。登録した動画と設定はそのまま使えます。</p>
  <button id="check-update" type="button" disabled>アップデートを確認</button>
  <a href="./">アプリを開く</a>
  <p id="update-status" role="status">インターネットに接続して更新してください。</p>
</main>
</body>
</html>
