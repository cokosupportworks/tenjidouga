<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="展示動画プレイヤー">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="./style.css">
<title>展示動画プレイヤー</title>
</head>
<body>
<main id="screen" class="screen">
  <div id="frame" class="frame">
    <video id="player" playsinline webkit-playsinline preload="metadata" aria-label="選択した動画"></video>
    <div id="empty" class="empty">
      <span class="empty-icon" aria-hidden="true">▷</span>
      <strong id="empty-title">動画がありません</strong>
      <p id="empty-text">設定から動画を追加してください</p>
    </div>
  </div>
  <div id="decorations" class="decorations" aria-hidden="true"></div>
  <div class="controls" aria-label="再生コントロール">
    <div class="transport">
      <button id="back" class="skip" aria-label="10秒戻す" title="10秒戻す" disabled><span aria-hidden="true">↶</span><small>10</small></button>
      <button id="toggle" class="play" aria-label="再生" title="再生" disabled><span class="play-icon" aria-hidden="true"></span></button>
      <button id="forward" class="skip" aria-label="10秒送る" title="10秒送る" disabled><span aria-hidden="true">↷</span><small>10</small></button>
    </div>
    <label class="seek"><span id="elapsed">0:00</span><input id="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="再生位置" disabled><span id="duration">0:00</span></label>
    <button id="settings" class="gear" aria-label="設定" title="設定">⚙</button>
  </div>
  <div id="rail" class="rail" aria-label="動画一覧"><div id="rail-track" class="rail-track"></div></div>
  <div id="notice" class="notice" role="status" hidden></div>
</main>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <header class="settings-head">
    <h1 id="settings-title">設定</h1>
    <button id="close-settings" class="icon-button" aria-label="設定を閉じる" title="設定を閉じる">×</button>
  </header>
  <nav class="tabs" aria-label="設定の項目">
    <button data-tab="library" aria-pressed="true">動画</button>
    <button data-tab="layout" aria-pressed="false">レイアウト</button>
    <button data-tab="objects" aria-pressed="false">表示要素</button>
  </nav>
  <div class="settings-body">
    <section id="library" class="panel">
      <div class="section-bar"><div><h2>登録済みの動画</h2><p id="offline-state" role="status">オフライン利用の準備中</p></div><button id="add-videos" class="primary">＋ 動画を追加</button></div>
      <p id="import-state" class="message" role="status" hidden></p>
      <div id="library-list" class="library-list"></div>
      <section id="video-editor" class="editor" hidden>
        <div class="section-bar"><h2 id="edit-title">動画を編集</h2><button id="close-editor" class="secondary">閉じる</button></div>
        <div class="edit-grid">
          <div><video id="preview-video" playsinline muted preload="auto" aria-label="サムネイルのプレビュー"></video>
          <label class="seek"><span id="frame-time">0:00</span><input id="frame-seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="サムネイルに使う位置"><span id="frame-duration">0:00</span></label>
          <div class="frame-tools"><button id="frame-prev" class="secondary" aria-label="サムネイル位置を0.04秒戻す">−0.04秒</button><button id="frame-next" class="secondary" aria-label="サムネイル位置を0.04秒進める">＋0.04秒</button><button id="capture" class="secondary">このフレームを使う</button></div></div>
          <div class="fields"><label>キャプション<input id="caption" type="text" maxlength="120" placeholder="サムネイルの下に表示"></label>
          <label class="range-field"><span>再生音量 <output id="volume-value">100%</output></span><input id="volume" type="range" min="0" max="100" value="100"></label>
          <button id="audition" class="secondary">音量を試聴</button></div>
        </div>
        <p id="edit-state" class="message" role="status" hidden></p>
      </section>
    </section>
    <section id="layout" class="panel" hidden>
      <div class="section-bar"><h2>画面レイアウト</h2><button id="reset-layout" class="secondary">初期配置に戻す</button></div>
      <div id="layout-preview" class="mock"></div>
      <section class="rail-settings" aria-labelledby="rail-settings-title">
        <div class="section-bar">
          <h2 id="rail-settings-title">サムネイルの配置</h2>
          <label class="selection"><span class="sr-only">サムネイルの並べ方</span>
            <select id="rail-mode"><option value="even">均等に並べる</option><option value="custom">間隔を個別に調整</option></select>
          </label>
        </div>
        <div id="rail-custom" hidden>
          <p id="rail-gap-help" class="message">各サムネイルと、その一つ前のサムネイルとの間隔を指定します。</p>
          <div id="rail-gaps" class="rail-gaps"></div>
        </div>
      </section>
      <div id="layout-fields" class="layout-fields"></div>
    </section>
    <section id="objects" class="panel" hidden>
      <div class="section-bar"><h2>表示要素</h2><label class="selection"><span class="sr-only">追加する要素</span><select id="object-type"><option value="text">テキスト</option><option value="rect">四角</option><option value="circle">円</option><option value="image">イラスト画像</option></select></label><button id="add-object" class="primary">＋ 追加</button></div>
      <div id="object-preview" class="mock"></div>
      <div id="object-list" class="object-list"></div>
      <div id="object-fields" class="layout-fields" hidden></div>
    </section>
  </div>
</dialog>
<input id="video-picker" type="file" accept="video/*,.mp4,.mov,.m4v,.webm" multiple hidden>
<input id="image-picker" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif,image/heic" hidden>
<script type="module" src="./app.js"></script>
</body>
</html>
